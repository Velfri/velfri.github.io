<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Smart Lamp</title>
  <meta name="theme-color" content="#12141A">
  <meta name="description" content="Керування світловими ефектами Smart Lamp">

  <!-- PWA та налаштування для iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Lamp">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background-color: #12141A;
    }
    body {
      color: #f1f1f2;
      font-family: system-ui, sans-serif;
    }
    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #12141A;
      touch-action: pan-y;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #fps-counter {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      z-index: 10;
      padding: 4px 7px;
      border-radius: 3px;
      background: rgba(18, 20, 26, 0.72);
      color: rgba(255, 255, 255, 0.82);
      font: 11px/1.2 monospace;
      pointer-events: none;
    }
    #controls {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      margin-top: 100svh;
      padding: 34px 20px calc(36px + env(safe-area-inset-bottom));
      background: #181a20;
      border-top: 1px solid #343740;
    }
    .controls-inner {
      width: min(100%, 560px);
      margin: 0 auto;
    }
    .controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    .controls-header h1 {
      font-size: 19px;
      font-weight: 600;
    }
    .power-button,
    .seed-button,
    .effect-button {
      min-height: 42px;
      border: 1px solid #41444d;
      border-radius: 6px;
      background: #22252d;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .power-button {
      padding: 0 14px;
      border-color: #a94e26;
      background: #38251f;
    }
    .control-section {
      padding: 20px 0;
      border-top: 1px solid #343740;
    }
    .section-heading,
    .range-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .section-heading h2,
    .range-heading label {
      font-size: 15px;
      font-weight: 550;
    }
    output {
      color: #b7bac2;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      display: block;
      width: 100%;
      height: 28px;
      accent-color: #ff7a32;
      touch-action: pan-x;
    }
    .effect-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .effect-button {
      padding: 0 8px;
      font-size: 14px;
    }
    .effect-button[aria-pressed="true"] {
      border-color: #ff8a45;
      background: #58301f;
      color: #fff4eb;
    }
    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .color-row label {
      font-size: 14px;
    }
    input[type="color"] {
      width: 54px;
      height: 40px;
      padding: 3px;
      border: 1px solid #41444d;
      border-radius: 6px;
      background: #22252d;
    }
    .seed-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .seed-row p {
      color: #b7bac2;
      font-size: 13px;
    }
    .seed-button {
      flex: 0 0 auto;
      padding: 0 12px;
      font-size: 13px;
    }
    .sync-note {
      margin-top: 20px;
      color: #8e929c;
      font-size: 12px;
      line-height: 1.5;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      position: relative;
      background: #111217;
      font-family: "Plus Jakarta Sans", sans-serif;
      touch-action: manipulation;
    }
    #bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at 50% 48%, var(--glow-color, #ff7420) 0%, rgba(17, 18, 23, 0) 68%);
      transition: opacity 300ms ease;
    }
    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }
    #scene canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fps-counter {
      top: calc(env(safe-area-inset-top) + 10px);
      left: calc(env(safe-area-inset-left) + 10px);
      z-index: 8;
      background: rgba(10, 11, 15, 0.68);
      backdrop-filter: blur(10px);
    }
    .glass-panel {
      background: rgba(21, 22, 29, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .app-header {
      position: fixed;
      z-index: 6;
      top: calc(env(safe-area-inset-top) + 18px);
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .brand-chip, .power-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-radius: 14px;
      color: #f5f5f6;
      pointer-events: auto;
    }
    .brand-chip {
      font-size: 13px;
      font-weight: 700;
    }
    .brand-chip [data-lucide="lamp"] { color: #ffb254; }
    .power-button {
      justify-content: center;
      width: 48px;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .power-button[aria-pressed="true"] [data-lucide] { color: #76dfa6; }
    .power-button[aria-pressed="false"] [data-lucide] { color: #ff8c84; }
    #power-badge {
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #c4c6cd;
      font-size: 9px;
      font-weight: 700;
    }
    #power-badge[data-on="true"] { color: #83e0ad; }
    #power-status { display: none; }
    .control-panel {
      position: fixed;
      z-index: 6;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: min(460px, calc(100% - 28px));
      max-height: min(58dvh, 470px);
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateX(-50%);
      padding: 17px 18px 15px;
      border-radius: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.2) transparent;
    }
    .panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .panel-row + .panel-row { margin-top: 15px; }
    .control-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b9bbc3;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .color-tools, .swatches, .mode-options {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-swatch {
      width: 25px;
      height: 25px;
      flex: 0 0 auto;
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
    }
    .color-swatch:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid #ffd19b;
      outline-offset: 2px;
    }
    #mono-color {
      width: 30px;
      height: 30px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      background: rgba(0,0,0,.25);
      cursor: pointer;
    }
    #mono-color::-webkit-color-swatch-wrapper { padding: 0; }
    #mono-color::-webkit-color-swatch { border: 0; border-radius: 50%; }
    .range-block { display: block; }
    .range-heading {
      margin: 0 0 7px;
      font-size: 11px;
    }
    .range-heading label { font-size: 12px; font-weight: 500; }
    input[type="range"] {
      height: 5px;
      accent-color: #ff9b50;
    }
    .mode-row {
      padding-top: 13px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .mode-options {
      gap: 3px;
      padding: 3px;
      border-radius: 11px;
      background: rgba(0,0,0,.28);
    }
    .effect-button {
      min-height: 32px;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a5a7af;
      font-size: 11px;
      white-space: nowrap;
    }
    .effect-button[aria-pressed="true"] {
      background: rgba(255,255,255,.14);
      color: #fff;
    }
    #mono-config { min-height: 30px; }
    #mono-config[hidden] { display: none; }
    .seed-row {
      padding-top: 11px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .seed-button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 11px;
    }
    .sync-note { display: none; }
    @media (max-width: 380px) {
      .control-panel { padding: 14px 13px 12px; }
      .color-tools, .swatches { gap: 5px; }
      .color-swatch { width: 23px; height: 23px; }
      .effect-button { padding: 0 7px; font-size: 10px; }
      .app-header { left: 13px; right: 13px; }
    }
    @media (max-height: 650px) {
      .control-panel { max-height: 48dvh; padding-top: 12px; }
      .panel-row + .panel-row { margin-top: 10px; }
    }
    html, body {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: auto;
    }
    body { min-height: 100svh; }
    #scene { touch-action: pan-y; }
    .control-panel {
      position: relative;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      width: min(460px, calc(100% - 28px));
      max-height: none;
      margin: 100svh auto 24px;
      transform: none;
      overflow: visible;
    }
    .control-panel #fps-counter {
      position: static;
      display: block;
      width: fit-content;
      margin-bottom: 14px;
      padding: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }
    @media (orientation: landscape) and (min-width: 600px) {
      html, body { height: 100%; overflow: hidden; }
      .control-panel {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        left: auto;
        width: min(340px, 38vw);
        max-height: none;
        margin: 0;
        transform: none;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>
  <div id="bg-glow"></div>
  <div id="scene" aria-label="Візуалізація лампи"></div>
  <section class="glass-panel control-panel" aria-label="Керування лампою">
    <div id="fps-counter" aria-hidden="true">FPS --</div>
    <div class="panel-row">
      <span class="control-label">Колір</span>
      <div class="color-tools">
        <div class="swatches" aria-label="Швидкий вибір кольору">
          <button class="color-swatch" type="button" data-color="#ff5500" style="background:#ff5500" aria-label="Помаранчевий"></button>
          <button class="color-swatch" type="button" data-color="#ffaa00" style="background:#ffaa00" aria-label="Бурштиновий"></button>
          <button class="color-swatch" type="button" data-color="#00c9d8" style="background:#00c9d8" aria-label="Бірюзовий"></button>
          <button class="color-swatch" type="button" data-color="#9d62ff" style="background:#9d62ff" aria-label="Фіолетовий"></button>
          <button class="color-swatch" type="button" data-color="#ff4778" style="background:#ff4778" aria-label="Рожевий"></button>
        </div>
        <input id="mono-color" type="color" value="#ff7420" aria-label="Вибрати колір">
      </div>
    </div>

    <div class="panel-row range-block">
      <div class="range-heading">
        <label for="brightness"><i data-lucide="sun" width="13" height="13"></i> Яскравість</label>
        <output id="brightness-value" for="brightness">100%</output>
      </div>
      <input id="brightness" type="range" min="0" max="100" value="100">
    </div>

    <div class="panel-row mode-row">
      <span class="control-label">Ефект</span>
      <div class="mode-options" role="group" aria-label="Режим ефекту">
        <button class="effect-button" type="button" data-effect="fire" aria-pressed="true">Вогонь</button>
        <button class="effect-button" type="button" data-effect="mono" aria-pressed="false">Моно</button>
        <button class="effect-button" type="button" data-effect="rainbow" aria-pressed="false">Райдуга</button>
      </div>
    </div>

    <div id="mono-config" class="panel-row" hidden>
      <span class="control-label">Колір монохрому</span>
      <span class="control-label">Вибери вище</span>
    </div>

    <div class="panel-row range-block">
      <div class="range-heading">
        <label for="effect-speed"><i data-lucide="gauge" width="13" height="13"></i> Швидкість</label>
        <output id="effect-speed-value" for="effect-speed">1.0×</output>
      </div>
      <input id="effect-speed" type="range" min="25" max="200" value="100">
    </div>

    <div class="panel-row seed-row">
      <span class="control-label">Seed <output id="effect-seed"></output></span>
      <button id="new-seed" class="glass-panel seed-button" type="button">Новий варіант</button>
    </div>
  </section>

  <script src="sketch.js"></script>
  <script>
    (() => {
      const counter = document.getElementById('fps-counter');
      let lastUpdate = performance.now();
      let frames = 0;

      function updateCounter(now) {
        frames++;
        const elapsed = now - lastUpdate;
        if (elapsed >= 1000) {
          counter.textContent = `FPS ${Math.round(frames * 1000 / elapsed)}`;
          frames = 0;
          lastUpdate = now;
        }
        requestAnimationFrame(updateCounter);
      }

      requestAnimationFrame(updateCounter);
    })();
    window.addEventListener('load', () => lucide.createIcons());
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
