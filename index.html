<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <!-- Блокування масштабування для нативного відчуття додатка -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Lamp</title>

  <!-- PWA та налаштування для iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Lamp">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Підключення p5.js через CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none; /* Відключає контекстне меню на iOS */
      -webkit-user-select: none;   /* Відключає виділення тексту */
      user-select: none;
      touch-action: none;         /* Блокує стандартний скрол сторінки при свайпах */
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #12141A;
    }
    canvas {
      display: block;
    }
    #fps-counter {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 10;
      padding: 4px 7px;
      border-radius: 3px;
      background: rgba(18, 20, 26, 0.72);
      color: rgba(255, 255, 255, 0.82);
      font: 11px/1.2 monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Підключення вашого скрипту 3D-лампи -->
  <div id="fps-counter" aria-hidden="true">FPS --</div>
  <script src="sketch.js"></script>
</body>
</html>
