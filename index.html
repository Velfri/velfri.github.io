<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smart Lamp</title>
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b14;--panel:#141120;--card:#1c1829;--card2:#241f35;--line:rgba(255,255,255,.07);--acc:#8b5cf6;--acc2:#c4b5fd;--text:#ece9f5;--muted:#8b86a0;--navh:76px;--sheet-top:calc(env(safe-area-inset-top) + 112px);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--panel-bg:#121118}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#scene{position:fixed;inset:0;z-index:1;touch-action:none}
#scene canvas{width:100%;height:100%;display:block}
#topbar{transition:left .3s cubic-bezier(.2,.85,.25,1);position:fixed;z-index:7;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px;border-radius:99px;background:var(--bar);border:1px solid var(--line)}
.tb-name{min-width:0;flex:0 0 clamp(112px,34%,176px)}.tb-bri .val{flex:none;width:44px;text-align:right}
.tb-name b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-name small{display:block;font-size:12px;color:var(--acc2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-bri{flex:1;display:flex;align-items:center;gap:10px;color:var(--muted);min-width:0}
.tb-bri input{flex:1;min-width:0}
.val{font-size:13px;color:var(--acc2);font-variant-numeric:tabular-nums}
#tabs{position:fixed;z-index:7;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:24px;background:var(--bar);border:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;font-size:10.5px;color:var(--muted);border-radius:18px;transition:.2s}
#tabs button[aria-selected="true"]{color:#fff;background:color-mix(in srgb,var(--acc) 22%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
#sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;top:var(--sheet-top);margin:0 auto;width:100%;max-width:560px;padding-bottom:calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:var(--panel-bg);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;transform:translateY(108%);transition:transform .32s cubic-bezier(.2,.85,.25,1);will-change:transform;contain:layout paint}
#sheet.open{transform:none}
body.sheet-open #topbar{left:92px}
.speedcard{padding:14px 16px 8px;margin-bottom:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
@media (min-width:900px){
 #topbar{left:20px;right:auto;margin:0;width:min(620px,calc(100vw - 620px))}
 #tabs{left:auto;right:16px;top:16px;bottom:16px;width:60px;max-width:none;margin:0;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:8px 6px;border-radius:22px}
 #tabs button{font-size:0;gap:0;padding:14px 0}
 #sheet{left:auto;right:88px;top:16px;bottom:16px;margin:0;contain:none;width:min(460px,calc(100vw - 580px));max-width:none;top:16px;height:auto;padding-bottom:0;border:1px solid var(--line);border-radius:28px;transform:translateX(calc(100% + 140px));box-shadow:none}
 #sheet.open{transform:none}
 body.sheet-open #topbar{left:20px}
 #grab{cursor:default;padding-top:18px}#grab i{display:none}
}
#grab{padding:10px 0 4px;touch-action:none;cursor:grab}
#grab i{display:block;width:40px;height:4px;margin:0 auto 10px;border-radius:9px;background:rgba(255,255,255,.18)}
.gtitle{display:flex;align-items:center;gap:4px;padding:0 14px 8px 20px;min-height:40px}.gtitle .stitle{font-size:18px;font-weight:650}.back{display:grid;place-items:center;width:34px;height:34px;margin-left:-10px;border-radius:50%;color:var(--acc2)}
#pages{flex:1;overflow-y:auto;padding:6px 16px 16px;scrollbar-width:none;overscroll-behavior:contain}
#pages::-webkit-scrollbar{display:none}
h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.block+.block{margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff}
.btn:active{transform:scale(.97)}
.input{width:100%;min-height:42px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px}
.input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;margin:12px 0 14px;overflow-x:auto;scrollbar-width:none}
.chips button{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:#fff}
.fx,.preset>button:first-child,.cursum{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid transparent}
.fx+.fx{margin-top:8px}
.fx[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.strip{width:68px;height:44px;border-radius:12px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.strip.sm{width:44px;height:34px;border-radius:10px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fx .txt small{white-space:normal}.txt b{font-size:14.5px;font-weight:600}.txt small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.fx[aria-pressed="true"] .tag{background:color-mix(in srgb,var(--acc) 30%,transparent);color:#fff}
.dots{display:flex}.dots i{width:16px;height:16px;border-radius:50%;margin-left:-5px;border:2px solid var(--card);box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.preset{display:flex;align-items:center;border-radius:16px;background:var(--card);border:1px solid transparent;margin-bottom:8px}
.preset[aria-current="true"]{border-color:var(--acc)}
.preset>button:first-child{background:none;border:0}
.preset .x{padding:0 16px;font-size:20px;color:var(--muted)}
.cursum{margin:10px 0}
#slots{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
#slots button{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px}
#slots button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
#slots i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:10px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 60%,transparent)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
input.grad::-webkit-slider-runnable-track{height:10px;background:linear-gradient(90deg,var(--g1),var(--g2))}
input.grad::-webkit-slider-thumb{margin-top:-6px}
input.grad::-moz-range-track{height:10px;background:linear-gradient(90deg,var(--g1),var(--g2))}
#swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;justify-items:center}
#swatches button{width:100%;max-width:42px;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
#swatches button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 60%,transparent)}
#palettes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#palettes button{display:flex;flex-direction:column;gap:7px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
#palettes span{display:block;height:22px;border-radius:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:14px;background:var(--bg)}
.seg button{min-height:36px;border-radius:11px;font-size:12.5px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--card2);color:#fff}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
.item small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:99px;background:var(--card2);border:1px solid var(--line);transition:.2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle input:checked+i{background:var(--acc);border-color:transparent}
.toggle input:checked+i::after{left:25px;background:#fff}
.time{width:100%;min-height:68px;margin:10px 0 4px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:36px;font-family:inherit;text-align:center;color-scheme:dark}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
#toast{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-8px);padding:9px 16px;border-radius:14px;font-size:13px;font-weight:600;background:var(--card2);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fps-counter{position:fixed;z-index:9;left:10px;top:calc(env(safe-area-inset-top) + 10px);padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.6);font:11px monospace;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.discwrap{position:relative;width:min(200px,54vw);aspect-ratio:1;margin:0 auto 14px}
#disc{width:100%;height:100%;border-radius:50%;touch-action:none;cursor:pointer;background:linear-gradient(rgba(0,0,0,var(--dk,0)),rgba(0,0,0,var(--dk,0))),radial-gradient(circle closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.35)}
#ring-thumb{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.center{display:flex;justify-content:center;margin-bottom:6px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 4px}
#pop-bg{position:fixed;inset:0;z-index:29}
.pop{position:fixed;z-index:30;min-width:190px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--bg) 78%,#fff 10%);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.po{display:block;width:100%;padding:11px 14px;border-radius:11px;font-size:14px}
.po[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent);color:#fff}
.lookprev{position:relative;height:176px;border-radius:20px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--pv1,#000),var(--pv2,#000))}
.lp-lamp{position:absolute;left:16px;top:14px;width:24px;height:48px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:0 0 26px color-mix(in srgb,var(--acc) 60%,transparent)}
.lp-bar{position:absolute;left:56px;right:14px;top:18px;height:24px;border-radius:99px;background:var(--bar)}
.lp-bar i{position:absolute;left:14px;right:14px;top:10px;height:4px;border-radius:9px;background:var(--acc)}
.lp-sheet{position:absolute;left:0;right:0;bottom:0;height:104px;border-radius:18px 18px 0 0;background:var(--panel-bg);padding:12px 14px;border-top:1px solid var(--line)}
.lp-row{height:22px;border-radius:9px;background:var(--card);margin-bottom:8px}
.lp-btn{width:96px;height:26px;border-radius:9px;background:var(--acc)}
.menu{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px}
.mi b{font-weight:600;flex:1}.mi small{color:var(--muted);font-size:13px}.mi svg{width:18px;height:18px;color:var(--muted)}
.sub .item:last-child{border-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.opt i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.opt .st{width:34px;height:22px;border-radius:7px}
#accents .opt{padding:10px}
.statusline{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
.rand{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px}
.rand svg{width:18px;height:18px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-fx" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
 <symbol id="i-color" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.5-2.2-.5-1.2.2-2.3 1.6-2.3H17a4 4 0 0 0 4-4C21 6.8 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></symbol>
 <symbol id="i-saved" viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></symbol>
 <symbol id="i-sun" viewBox="0 0 24 24"><path d="M3 19h18M7 19a5 5 0 0 1 10 0M12 4v4M5 9l2 2M19 9l-2 2"/></symbol>
 <symbol id="i-set" viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
 <symbol id="i-bri" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
 <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/></symbol>
 <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
</svg>
<div id="scene"></div>
<header id="topbar">
 <div class="tb-name"><b id="lamp-title"></b><small id="now"></small></div>
 <div class="tb-bri"><svg class="i"><use href="#i-bri"/></svg><input id="brightness" type="range" min="0" max="100" value="100" aria-label="Brightness"><span class="val" id="brightness-value"></span></div>
</header>
<nav id="tabs">
 <button type="button" data-tab="fx" aria-selected="false" data-i18n-label="title.fx"><svg class="i"><use href="#i-fx"/></svg><span data-i18n="tab.fx"></span></button>
 <button type="button" data-tab="color" aria-selected="false" data-i18n-label="title.color"><svg class="i"><use href="#i-color"/></svg><span data-i18n="tab.color"></span></button>
 <button type="button" data-tab="saved" aria-selected="false" data-i18n-label="title.saved"><svg class="i"><use href="#i-saved"/></svg><span data-i18n="tab.saved"></span></button>
 <button type="button" data-tab="sun" aria-selected="false" data-i18n-label="title.sun"><svg class="i"><use href="#i-sun"/></svg><span data-i18n="tab.sun"></span></button>
 <button type="button" data-tab="set" aria-selected="false" data-i18n-label="title.set"><svg class="i"><use href="#i-set"/></svg><span data-i18n="tab.set"></span></button>
</nav>
<aside id="sheet">
 <div id="grab"><i></i><div class="gtitle"><button id="back" class="back" type="button" hidden data-i18n-label="common.back"><svg class="i"><use href="#i-back"/></svg></button><div class="stitle" id="stitle"></div></div></div>
 <div id="pages">
  <section class="page" data-p="fx" hidden>
   <div class="speedcard"><div class="row"><h3 style="margin:0" data-i18n="fx.speed"></h3><span class="val" id="effect-speed-value"></span></div><input id="effect-speed" type="range" min="25" max="200" value="100"></div>
   <input id="fx-search" class="input" type="search" data-i18n-ph="fx.search">
   <div id="fx-filters" class="chips"><button type="button" data-filter="all" aria-pressed="true" data-i18n="fx.all"></button><button type="button" data-filter="own" aria-pressed="false" data-i18n="fx.own"></button><button type="button" data-filter="auto" aria-pressed="false" data-i18n="fx.auto"></button></div>
   <div id="effect-list"></div>
  </section>
  <section class="page" data-p="color" hidden>
   <div id="color-none" hidden><p class="hint" style="margin:0 0 14px" data-i18n="col.none"></p><button id="to-mono" class="btn pri" type="button" data-i18n="col.mono"></button></div>
   <div id="color-ui">
    <div id="slots"></div>
    <div class="discwrap"><div id="disc" data-i18n-label="col.hue"></div><div id="ring-thumb"></div></div>
    <div class="center"><button id="rand-pal" class="btn" type="button"><svg class="i"><use href="#i-dice"/></svg><span data-i18n="col.rand"></span></button></div>
    <div class="lbl"><span data-i18n="col.val"></span></div><input id="val" class="grad" type="range" min="5" max="100" value="100">
    <h3 style="margin-top:22px" data-i18n="col.std"></h3><div id="swatches"></div>
    <h3 style="margin-top:22px" data-i18n="col.sets"></h3><div id="palettes"></div>
   </div>
  </section>
  <section class="page" data-p="saved" hidden>
   <h3 data-i18n="saved.cur"></h3>
   <div class="cursum" id="cur-sum"></div>
   <input id="cur-name" class="input" type="text" maxlength="24" data-i18n-ph="saved.name">
   <div class="row" style="margin:10px 0 22px;gap:8px"><button id="preset-add" class="btn pri" type="button" style="flex:1" data-i18n="saved.add"></button><button id="preset-update" class="btn" type="button" style="flex:1" data-i18n="saved.upd"></button></div>
   <h3 data-i18n="saved.list"></h3><div id="preset-list"></div>
   <p class="hint" data-i18n="saved.hint"></p>
  </section>
  <section class="page" data-p="sun" hidden>
   <div class="row"><h3 style="margin:0" data-i18n="sun.alarm"></h3><label class="toggle"><input id="alarm-on" type="checkbox"><i></i></label></div>
   <input id="alarm-time" class="time" type="time" value="07:00">
