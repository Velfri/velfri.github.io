<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Smart Lamp</title>
  <meta name="theme-color" content="#12141A">
  <meta name="description" content="Керування світловими ефектами Smart Lamp">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Lamp">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    :root {
      --bg: #12141a;
      --accent: #ff9b50;
      --text: #f4f4f6;
      --muted: #9a9ea9;
      --glass: rgba(24, 26, 33, 0.72);
      --line: rgba(255, 255, 255, 0.1);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); overflow-x: hidden; }
    body { min-height: 100svh; touch-action: manipulation; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
    :focus-visible { outline: 2px solid #ffd19b; outline-offset: 2px; }

    #scene { position: fixed; inset: 0; z-index: 1; touch-action: pan-y; }
    #scene canvas { width: 100%; height: 100%; display: block; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      backdrop-filter: blur(20px) saturate(140%);
    }
    .i { width: 20px; height: 20px; flex: none; }
    #toast { position: fixed; z-index: 8; left: 50%; top: calc(env(safe-area-inset-top) + 18px); transform: translate(-50%, -8px); padding: 9px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .preset-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .preset-chip { display: inline-flex; align-items: center; border-radius: 99px; background: rgba(255,255,255,.07); border: 1px solid transparent; }
    .preset-chip[aria-current="true"] { border-color: rgba(255,155,80,.8); background: rgba(255,155,80,.14); }
    .preset-chip button { font-size: 12px; min-height: 34px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; border-radius: 99px; }
    .preset-chip button[data-del] { padding: 0 11px 0 2px; color: var(--muted); font-size: 16px; }
    .chip-sw { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
    .preset-actions { display: flex; gap: 8px; }

    .control-panel {
      position: relative; z-index: 6;
      width: min(460px, calc(100% - 24px));
      margin: 100svh auto calc(16px + env(safe-area-inset-bottom));
      padding: 14px 18px 18px; border-radius: 26px;
    }
    .grab { width: 38px; height: 4px; margin: 0 auto 14px; border-radius: 9px; background: rgba(255,255,255,.2); }
    .block + .block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: #c9cbd3; }
    .label .i { width: 15px; height: 15px; }
    .value { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .value b { color: var(--text); font-weight: 600; }
    .actual-brightness { margin-left: 6px; font-size: 11px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }

    .effect-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
    .effect-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border-radius: 16px; }
    .tile-swatch {
      width: 100%; max-width: 62px; aspect-ratio: 1; border-radius: 18px;
      border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
      transition: transform .15s, box-shadow .2s;
    }
    .tile-name { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .effect-tile:active .tile-swatch { transform: scale(.94); }
    .effect-tile[aria-pressed="true"] .tile-swatch { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,155,80,.45), 0 6px 18px rgba(0,0,0,.4); }
    .effect-tile[aria-pressed="true"] .tile-name { color: var(--text); font-weight: 600; }

    .swatches { display: flex; align-items: center; gap: 9px; }
    .color-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); }
    #mono-color { width: 32px; height: 32px; padding: 2px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; background: rgba(0,0,0,.25); cursor: pointer; }
    #mono-color::-webkit-color-swatch-wrapper { padding: 0; }
    #mono-color::-webkit-color-swatch { border: 0; border-radius: 50%; }
    #mono-color::-moz-color-swatch { border: 0; border-radius: 50%; }

    input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; background: transparent; touch-action: pan-y; }
    input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 9px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), rgba(255,255,255,.14) var(--p, 50%)); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    input[type="range"]::-moz-range-track { height: 6px; border-radius: 9px; background: rgba(255,255,255,.14); }
    input[type="range"]::-moz-range-progress { height: 6px; border-radius: 9px; background: var(--accent); }
    input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; }

    .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; border-radius: 12px; background: rgba(0,0,0,.3); }
    .curve-button { min-height: 32px; padding: 0 10px; border-radius: 9px; font-size: 11px; color: var(--muted); white-space: nowrap; transition: background .2s; }
    .curve-button[aria-pressed="true"] { background: rgba(255,255,255,.15); color: #fff; }
    .seed-button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: 11px; font-size: 12px; }

    #fps-counter { position: fixed; z-index: 9; left: 10px; bottom: 10px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.6); font: 11px monospace; pointer-events: none; }

    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    .control-panel { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.16) transparent; }
    .control-panel::-webkit-scrollbar { width: 4px; }
    .control-panel::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
    .control-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 9px; }
    .control-panel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3); }

    @media (max-width: 380px) {
      .control-panel { padding: 12px 14px 16px; }
    }
    @media (orientation: landscape) and (min-width: 600px) {
      html, body { height: 100%; overflow: hidden; }
      .control-panel {
        position: fixed; margin: 0; width: min(350px, 40vw); overflow-y: auto; overscroll-behavior: contain;
        top: max(74px, env(safe-area-inset-top)); bottom: max(14px, env(safe-area-inset-bottom));
        right: max(14px, env(safe-area-inset-right));
      }
      .grab { display: none; }
      .effect-list { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  </svg>

  <div id="scene" aria-label="Візуалізація лампи"></div>

  <section class="glass control-panel" aria-label="Керування лампою">
    <div class="grab"></div>

    <div class="block">
      <div class="head"><span class="label">Мої налаштування</span><span class="value">свайп ← → по лампі</span></div>
      <div id="preset-list" class="preset-list"></div>
      <div class="preset-actions">
        <button id="preset-add" class="seed-button glass" type="button">＋ Додати поточне</button>
        <button id="preset-update" class="seed-button glass" type="button">Оновити активне</button>
      </div>
    </div>

    <div class="block">
      <div class="head"><span class="label">Ефекти</span><span class="value"><b id="effect-name"></b></span></div>
      <div id="effect-list" class="effect-list" role="group" aria-label="Вибір ефекту"></div>
    </div>

    <div id="color-row" class="block row" hidden>
      <span class="label">Колір</span>
      <div class="swatches">
        <button class="color-swatch" type="button" data-color="#ff5500" style="background:#ff5500" aria-label="Помаранчевий"></button>
        <button class="color-swatch" type="button" data-color="#ffaa00" style="background:#ffaa00" aria-label="Бурштиновий"></button>
        <button class="color-swatch" type="button" data-color="#00c9d8" style="background:#00c9d8" aria-label="Бірюзовий"></button>
        <button class="color-swatch" type="button" data-color="#9d62ff" style="background:#9d62ff" aria-label="Фіолетовий"></button>
        <button class="color-swatch" type="button" data-color="#ff4778" style="background:#ff4778" aria-label="Рожевий"></button>
        <input id="mono-color" type="color" value="#ff7420" aria-label="Вибрати колір">
      </div>
    </div>

    <div class="block">
      <div class="head">
        <label class="label" for="brightness"><svg class="i"><use href="#i-sun"/></svg>Яскравість</label>
        <span class="value"><b id="brightness-value">100%</b><span class="actual-brightness">світло <span id="led-brightness">100%</span></span></span>
      </div>
      <input id="brightness" type="range" min="0" max="100" value="100">
      <div class="segmented" role="group" aria-label="Характер яскравості" style="margin-top:10px">
        <button class="curve-button" type="button" data-curve="soft" aria-pressed="false">М’яка</button>
        <button class="curve-button" type="button" data-curve="linear" aria-pressed="true">Лінійна</button>
        <button class="curve-button" type="button" data-curve="precise" aria-pressed="false">Точна</button>
      </div>
    </div>

    <div class="block">
      <div class="head">
        <label class="label" for="effect-speed"><svg class="i"><use href="#i-gauge"/></svg>Швидкість</label>
        <span class="value"><b id="effect-speed-value">1.0×</b></span>
      </div>
      <input id="effect-speed" type="range" min="25" max="200" value="100">
    </div>

    <div class="block row">
      <span class="label">Варіант <span class="value" id="effect-seed"></span></span>
      <button id="new-seed" class="seed-button glass" type="button"><svg class="i" style="width:15px;height:15px"><use href="#i-shuffle"/></svg>Новий</button>
    </div>
  </section>

  <div id="toast" class="glass" role="status"></div>
  <div id="fps-counter" hidden></div>

  <script src="sketch.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
